name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub's Ubuntu runners come with the Android SDK installed (ANDROID_HOME), so no setup step is needed.
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tv-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: tv-home.apk

      # The Play Store bundle, signed with the upload key from the repo's secrets (UPLOAD_KEYSTORE_BASE64 and
      # UPLOAD_KEYSTORE_PASSWORD). Skipped until those are added.
      - name: Build the Play Store bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab tv-home.aab
          rm "$RUNNER_TEMP/upload.jks"

      # Every build of main replaces tv-home.apk on the "latest" release, so there's one link to download.
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: |
            tv-home.apk
            tv-home.aab
          fail_on_unmatched_files: false
          body: tv-home.apk is for sideloading (Downloader or ADB). tv-home.aab is the bundle to upload to Google Play. See the README.
